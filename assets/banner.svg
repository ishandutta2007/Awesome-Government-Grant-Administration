<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(5deg)}}@keyframes dashMove{0%{stroke-dashoffset:100}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:18px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:13px;fill:#a5b4fc}.animated-bg-circle{animation:pulseGlow 8s infinite ease-in-out;transform-origin:center}.floating-card{animation:floatParticle 6s infinite ease-in-out}.flowing-line{stroke-dasharray:10 15;animation:dashMove 20s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="180" fill="#6366f1" class="animated-bg-circle" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="280" r="220" fill="#ec4899" class="animated-bg-circle" filter="url(#glow)" opacity=".12"/><path fill="none" stroke="url(#accentGrad)" stroke-width="2" d="M -50,280 Q 300,100 600,280 T 1250,150" class="flowing-line" opacity=".3"/><path fill="none" stroke="#6366f1" stroke-width="1.5" d="M -50,100 Q 400,320 800,120 T 1250,260" class="flowing-line" opacity=".25"/><g stroke="#fff" stroke-width="1" opacity=".05"><line x1="0" x2="1200" y1="90" y2="90"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="270" y2="270"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/></g><g transform="translate(80, 80)"><g transform="translate(0, 0)"><rect width="260" height="32" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" rx="16"/><circle cx="16" cy="16" r="5" fill="#10b981"/><text x="30" y="21" class="badge-text">GOVERNMENT GRANT ECOSYSTEM</text></g><text x="0" y="85" class="title">Awesome Government Grant Administration</text><text x="0" y="125" class="subtitle">A curated index of top grant lifecycle SaaS platforms, open-source software &amp; tools.</text><rect width="480" height="4" x="0" y="145" fill="url(#accentGrad)" rx="2"/><g transform="translate(0, 175)"><rect width="160" height="36" x="0" y="0" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" rx="8"/><text x="16" y="23" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">🏛️ Public Sector</text><rect width="160" height="36" x="175" y="0" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" rx="8"/><text x="191" y="23" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">💼 Top SaaS Matrix</text><rect width="180" height="36" x="350" y="0" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" rx="8"/><text x="366" y="23" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">💻 Open-Source Repos</text></g></g><g class="floating-card" transform="translate(920, 75)"><rect width="200" height="210" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".12" backdrop-filter="blur(10px)" rx="16"/><path fill="none" stroke="url(#accentGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M 30,150 L 70,110 L 110,130 L 170,70"/><circle cx="170" cy="70" r="6" fill="#ec4899"/><rect width="90" height="10" x="30" y="35" fill="#6366f1" opacity=".8" rx="5"/><rect width="130" height="8" x="30" y="55" fill="#94a3b8" opacity=".4" rx="4"/><g transform="translate(30, 175)"><rect width="140" height="6" fill="#334155" rx="3"/><rect width="90" height="6" fill="url(#accentGrad)" rx="3"/></g></g></svg>