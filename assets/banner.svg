<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #a5b4fc;
    }
    
    /* CSS Animations for dynamic aspect */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-bg-circle {
      animation: pulseGlow 8s infinite ease-in-out;
      transform-origin: center;
    }
    .floating-card {
      animation: floatParticle 6s infinite ease-in-out;
    }
    .flowing-line {
      stroke-dasharray: 10 15;
      animation: dashMove 20s linear infinite;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Animated Background Elements (Positioned safely behind foreground content) -->
  <circle class="animated-bg-circle" cx="150" cy="80" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle class="animated-bg-circle" cx="1050" cy="280" r="220" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Flowing Network Lines in Background -->
  <path class="flowing-line" d="M -50,280 Q 300,100 600,280 T 1250,150" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" />
  <path class="flowing-line" d="M -50,100 Q 400,320 800,120 T 1250,260" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.25" />

  <!-- Structural Decorative Grid Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Foreground Content Area (Ensured crystal clear visibility) -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="260" height="32" rx="16" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" class="badge-text">GOVERNMENT GRANT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome Government Grant Administration</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">A curated index of top grant lifecycle SaaS platforms, open-source software &amp; tools.</text>

    <!-- Gradient Bar Accent under title -->
    <rect x="0" y="145" width="480" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Feature Pills Bar -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="16" y="23" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">🏛️ Public Sector</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="160" height="36" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="191" y="23" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">💼 Top SaaS Matrix</text>

      <!-- Pill 3 -->
      <rect x="350" y="0" width="180" height="36" rx="8" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="366" y="23" font-family="Segoe UI, sans-serif" font-size="13" fill="#e2e8f0" font-weight="500">💻 Open-Source Repos</text>
    </g>
  </g>

  <!-- Right Decorative Floating Graphical Card (Behind text coordinate space) -->
  <g class="floating-card" transform="translate(920, 75)">
    <rect width="200" height="210" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" backdrop-filter="blur(10px)" />
    <!-- Mini Graphic inside Card -->
    <path d="M 30,150 L 70,110 L 110,130 L 170,70" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="170" cy="70" r="6" fill="#ec4899" />
    
    <rect x="30" y="35" width="90" height="10" rx="5" fill="#6366f1" opacity="0.8" />
    <rect x="30" y="55" width="130" height="8" rx="4" fill="#94a3b8" opacity="0.4" />
    
    <g transform="translate(30, 175)">
      <rect width="140" height="6" rx="3" fill="#334155" />
      <rect width="90" height="6" rx="3" fill="url(#accentGrad)" />
    </g>
  </g>
</svg>
